<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee6f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#4b3b62}.phone{height:760px;width:370px;position:relative;overflow:hidden;border-radius:38px;border:9px solid #29252e;background:linear-gradient(165deg,#765e9f 0,#9d7fb6 33%,#fbf8fd 33%);box-shadow:0 30px 70px #553a6a44}.top{padding:20px;color:#fff}.bar{display:flex;justify-content:space-between;font-size:11px}.top h2{font-size:19px;margin:24px 0 5px}.top p{font-size:13px;color:#ecdef5;margin:0}.mask{position:absolute;inset:0;background:#241b3299;opacity:0;pointer-events:none;transition:.2s}.sheet{position:absolute;bottom:0;left:0;right:0;height:590px;background:#fbf8fd;border-radius:28px 28px 0 0;transform:translateY(105%);transition:.28s}.open .mask{opacity:1;pointer-events:auto}.open .sheet{transform:none}.head{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#8a789f;font-size:14px}.head b{color:#4a3b66;font-size:16px}.type{display:flex;justify-content:center;gap:8px}.type span{padding:6px 22px;border-radius:16px;font-size:13px}.type .on{background:#eadcf2;color:#8b4e78;font-weight:700}.money{text-align:center;font-size:42px;font-weight:750;margin:13px 0 18px}.rows{margin:0 17px;border:1px solid #eee6f3;background:#fff;border-radius:16px;padding:4px 14px}.row{height:44px;border-bottom:1px solid #f1ebf5;display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer}.row:last-child{border:0}.chosen{color:#74568d}.keypad{margin:16px 17px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{height:38px;background:#fff;box-shadow:0 2px 6px #60457b17;border-radius:9px;display:grid;place-items:center;font-size:18px}.key:nth-last-child(-n+3){font-size:13px;color:#9a8cbb}.actions{display:flex;gap:9px;margin:13px 17px}.voice{width:52px;border:0;border-radius:13px;background:#efe5f2;font-size:20px}.save{flex:1;border:0;border-radius:13px;background:linear-gradient(135deg,#b79cea,#f3a6c4);color:#fff;font-size:15px;font-weight:700}.picker{position:absolute;left:0;right:0;bottom:0;height:405px;background:#fff;border-radius:28px 28px 0 0;transform:translateY(105%);transition:.28s;z-index:5;padding:0 18px}.picking .picker{transform:none}.picker h3{text-align:center;font-size:16px;margin:20px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}.item{text-align:center;font-size:11px;color:#6f607e;cursor:pointer}.icon{width:47px;height:47px;margin:0 auto 5px;border-radius:50%;background:#f4edf8;display:grid;place-items:center;font-size:23px}.item:first-child .icon{background:#f6e1eb;box-shadow:0 0 0 3px #f9d6e4}.more{margin-top:18px;border-top:1px solid #f0eaf4;padding:15px 3px;display:flex;justify-content:space-between;color:#806b94;font-size:13px}.tip{position:absolute;z-index:10;top:15px;left:50%;transform:translateX(-50%);background:#332344c9;color:#fff;border-radius:18px;padding:7px 12px;font-size:12px;white-space:nowrap}@media(max-width:420px){body{display:block;background:#29252e}.phone{width:100%;height:100vh;border:0;border-radius:0}}
</style></head><body><div class="phone" id="app"><div class="tip" id="tip">点“记一笔”，再点“餐饮 ›”选择类别</div><div class="top"><div class="bar"><span>9:41</span><span>● ● ●</span></div><h2>记账花哪去了</h2><p>今天还没有记录</p></div><div class="mask" onclick="closeAll()"></div><section class="sheet"><div class="head"><span onclick="closeAll()">取消</span><b>记一笔</b><span onclick="closeAll()">×</span></div><div class="type"><span class="on">支出</span><span>收入</span></div><div class="money">¥ 0.00</div><div class="rows"><div class="row" onclick="openPicker()"><span>分类</span><span class="chosen" id="category">🍜 餐饮　›</span></div><div class="row"><span>日期</span><span class="chosen">今天　›</span></div><div class="row"><span>备注</span><span class="chosen">添加备注　›</span></div></div><div class="keypad"><div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key">.</div><div class="key">0</div><div class="key">⌫</div></div><div class="actions"><button class="voice">🎤</button><button class="save">保存</button></div></section><section class="picker"><div class="head"><span onclick="closePicker()">‹ 返回</span><b>选择分类</b><span></span></div><div class="grid"><div class="item" onclick="choose('🍜 餐饮')"><div class="icon">🍜</div>餐饮</div><div class="item" onclick="choose('🛍️ 购物')"><div class="icon">🛍️</div>购物</div><div class="item" onclick="choose('🚇 交通')"><div class="icon">🚇</div>交通</div><div class="item" onclick="choose('🏠 居住')"><div class="icon">🏠</div>居住</div><div class="item" onclick="choose('☕ 日用')"><div class="icon">☕</div>日用</div><div class="item" onclick="choose('🎮 娱乐')"><div class="icon">🎮</div>娱乐</div><div class="item" onclick="choose('💊 医疗')"><div class="icon">💊</div>医疗</div><div class="item" onclick="choose('🎁 人情')"><div class="icon">🎁</div>人情</div></div><div class="more"><span>管理分类</span><span>›</span></div></section><div style="position:absolute;bottom:24px;left:16px;right:16px;height:52px;border-radius:26px;background:#fff;padding:16px;color:#998bac;font-size:14px;box-shadow:0 8px 22px #6b4d8a26" onclick="openSheet()">＋　记一笔</div></div><script>function openSheet(){app.classList.add('open');tip.textContent='点“餐饮 ›”选择类别'}function openPicker(){app.classList.add('picking');tip.textContent='选一个类别，会立即回到金额键盘'}function closePicker(){app.classList.remove('picking');tip.textContent='继续输入金额或保存'}function choose(v){category.textContent=v+'　›';closePicker();tip.textContent='已选择 '+v+'，可继续输入金额'}function closeAll(){app.classList.remove('open','picking');tip.textContent='点“记一笔”，再点“餐饮 ›”选择类别'}</script></body></html>
