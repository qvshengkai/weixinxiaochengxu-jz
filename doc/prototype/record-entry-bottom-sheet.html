<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记账首页交互原型</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee6f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#4a3b66}.phone{position:relative;width:375px;height:780px;overflow:hidden;border:9px solid #2c2630;border-radius:40px;background:linear-gradient(165deg,#725b9d 0,#a383b9 40%,#f9f6fb 40%);box-shadow:0 28px 65px #5b3b7045}.top{padding:20px;color:#fff}.topline{display:flex;justify-content:space-between;font-size:11px}.top h1{font-size:20px;margin:24px 0 5px}.top p{margin:0;color:#f0e5f8;font-size:13px}.summary{margin:28px 18px;padding:20px;border:1px solid #ffffff60;border-radius:24px;background:#ffffff25;color:#fff}.summary small{color:#f1e6f8}.summary b{display:block;margin:7px 0;font-size:34px}.summary span{font-size:12px;color:#f0e5f8}.empty{margin:65px 25px;text-align:center;color:#9a8cbb;font-size:13px;line-height:1.8}.dock{position:absolute;right:16px;bottom:23px;left:16px;display:flex;gap:10px}.entry{flex:1;height:53px;padding:16px 20px;border-radius:27px;background:#fff;color:#998bac;box-shadow:0 9px 24px #64457b30;font-size:14px;cursor:pointer}.mic{width:53px;border:0;border-radius:50%;background:linear-gradient(135deg,#8fb7ea,#b79cea);color:#fff;font-size:21px;box-shadow:0 9px 20px #7950a955;cursor:pointer}.mask{position:absolute;inset:0;background:#241b32a8;opacity:0;pointer-events:none;transition:.2s}.sheet{position:absolute;right:0;bottom:0;left:0;height:605px;padding:0 17px 17px;border-radius:29px 29px 0 0;background:#fbf8fd;transform:translateY(105%);transition:.27s}.open .mask{opacity:1;pointer-events:auto}.open .sheet{transform:none}.head{height:58px;display:flex;align-items:center;justify-content:space-between;color:#89799d;font-size:14px}.head b{color:#4a3b66;font-size:16px}.head button{border:0;background:none;color:#89799d;font-size:23px;cursor:pointer}.types{display:flex;justify-content:center;gap:4px}.types span{padding:7px 24px;border-radius:17px;color:#876fa2;font-size:13px}.types .on{background:#eadcf2;color:#8a4e78;font-weight:700}.amount{margin:14px 0 18px;text-align:center;font-size:43px;font-weight:750}.fields{padding:3px 14px;border:1px solid #eee6f3;border-radius:16px;background:#fff}.row{display:flex;align-items:center;justify-content:space-between;height:45px;border-bottom:1px solid #f1ebf5;font-size:13px;cursor:pointer}.row:last-child{border:0}.value{color:#806b94}.keyboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}.key{height:39px;display:grid;place-items:center;border-radius:9px;background:#fff;box-shadow:0 2px 6px #60457b18;font-size:18px}.key.fn{font-size:13px;color:#9a8cbb}.actions{display:flex;gap:10px;margin-top:14px}.voice{width:54px;border:0;border-radius:14px;background:#efe5f2;color:#95638e;font-size:20px}.save{flex:1;border:0;border-radius:14px;background:linear-gradient(135deg,#b79cea,#f3a6c4);color:#fff;font-size:15px;font-weight:700}.backdrop{position:absolute;z-index:5;inset:0;background:#241b3230;display:none}.picker{position:absolute;z-index:6;right:0;bottom:0;left:0;min-height:410px;padding:0 18px 25px;border-radius:29px 29px 0 0;background:#fff;transform:translateY(105%);transition:.27s}.picking .backdrop{display:block}.picking .picker{transform:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}.cat{text-align:center;color:#746582;font-size:11px;cursor:pointer}.icon{width:47px;height:47px;margin:0 auto 5px;display:grid;place-items:center;border-radius:50%;background:#f4edf8;font-size:23px}.cat.selected .icon{background:#f6e1eb;box-shadow:0 0 0 3px #f9d6e4}.tip{position:absolute;z-index:9;top:12px;left:50%;padding:7px 12px;border-radius:18px;background:#332344cc;color:#fff;transform:translateX(-50%);white-space:nowrap;font-size:11px}@media(max-width:430px){body{display:block;background:#2c2630}.phone{width:100%;height:100vh;border:0;border-radius:0}}
</style></head><body><div class="phone" id="app"><div class="tip" id="tip">点击「记一笔」查看底部记账面板</div><section class="top"><div class="topline"><span>9:41</span><span>● ● ●</span></div><h1>花哪去了</h1><p>今天 · 7月27日</p></section><section class="summary"><small>今天支出</small><b>¥ 0.00</b><span>还没有记录，记下第一笔吧</span></section><div class="empty">✦<br>轻轻点一下底部，就能记下一笔</div><div class="dock"><div class="entry" onclick="openEntry()">＋　记一笔</div><button class="mic" onclick="voice(event)">🎤</button></div><div class="mask" onclick="closeAll()"></div><section class="sheet"><div class="head"><span onclick="closeAll()">取消</span><b>记一笔</b><button onclick="closeAll()">×</button></div><div class="types"><span class="on">支出</span><span>收入</span></div><div class="amount">¥ 0.00</div><div class="fields"><div class="row" onclick="openPicker()"><span>分类</span><span class="value" id="category">🍜 餐饮　›</span></div><div class="row"><span>日期</span><span class="value">今天　›</span></div><div class="row"><span>备注</span><span class="value">添加备注　›</span></div></div><div class="keyboard"><div class="key">1</div><div class="key">2</div><div class="key">3</div><div class="key">4</div><div class="key">5</div><div class="key">6</div><div class="key">7</div><div class="key">8</div><div class="key">9</div><div class="key fn">.</div><div class="key">0</div><div class="key fn">⌫</div></div><div class="actions"><button class="voice" onclick="voice(event)">🎤</button><button class="save">保存</button></div></section><div class="backdrop" onclick="closePicker()"></div><section class="picker"><div class="head"><span onclick="closePicker()">‹ 返回</span><b>选择分类</b><span></span></div><div class="grid"><div class="cat selected" onclick="choose('🍜 餐饮')"><div class="icon">🍜</div>餐饮</div><div class="cat" onclick="choose('🛍️ 购物')"><div class="icon">🛍️</div>购物</div><div class="cat" onclick="choose('🚇 交通')"><div class="icon">🚇</div>交通</div><div class="cat" onclick="choose('🏠 居家')"><div class="icon">🏠</div>居家</div><div class="cat" onclick="choose('🎮 娱乐')"><div class="icon">🎮</div>娱乐</div><div class="cat" onclick="choose('💄 美妆')"><div class="icon">💄</div>美妆</div><div class="cat" onclick="choose('💊 医疗')"><div class="icon">💊</div>医疗</div><div class="cat" onclick="choose('🎁 人情')"><div class="icon">🎁</div>人情</div></div></section></div><script>const app=document.getElementById('app'),tip=document.getElementById('tip'),category=document.getElementById('category');function openEntry(){app.classList.add('open');tip.textContent='点「餐饮 ›」选择类别'}function closeAll(){app.classList.remove('open','picking');tip.textContent='点击「记一笔」查看底部记账面板'}function openPicker(){app.classList.add('picking');tip.textContent='选中类别后会自动回到金额输入'}function closePicker(){app.classList.remove('picking');tip.textContent='继续输入金额或保存'}function choose(v){category.textContent=v+'　›';closePicker();tip.textContent='已选择 '+v+'，可继续输入金额'}function voice(e){e.stopPropagation();tip.textContent='语音入口：识别完成后回填表单，不自动保存'}</script></body></html>
