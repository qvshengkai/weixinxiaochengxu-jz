<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多模式记账输入台原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ff;color:#312644;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.phone{min-height:100vh;max-width:430px;margin:auto;padding:30px 18px 165px;background:radial-gradient(circle at 88% 10%,#f9dcff 0,transparent 30%),linear-gradient(155deg,#fcf9ff,#f5eeff)}.top{font-size:25px;font-weight:800;margin:14px 0 5px}.sub{color:#897d9e}.card{margin-top:26px;border:1px solid #ece1ff;border-radius:22px;padding:18px;background:#ffffffbf;box-shadow:0 12px 36px #5e3c8b12}.card b{font-size:17px}.summary{display:flex;justify-content:space-between;margin-top:17px}.summary div{padding:12px;border-radius:15px;background:#f8f1ff}.summary span{display:block;font-size:12px;color:#8d7ba5;margin-bottom:5px}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:12px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #eadfff;background:#fffffff2;backdrop-filter:blur(18px);box-shadow:0 -10px 30px #5a397b10}.modes{display:flex;gap:8px;overflow:auto;padding-bottom:10px;scrollbar-width:none}.mode{white-space:nowrap;border:1px solid #e4d7f6;background:#fff;color:#725d8b;border-radius:18px;padding:8px 12px;font-weight:650}.mode.active{border-color:#a76ad5;color:#fff;background:linear-gradient(100deg,#a86bdb,#ef95c3);box-shadow:0 6px 14px #b96cbb42}.hint{font-size:13px;color:#786987;padding:0 3px 9px}.examples{display:flex;gap:7px;overflow:auto;padding:0 0 10px}.example{border:0;color:#76548e;background:#f4eafb;border-radius:14px;padding:7px 11px;white-space:nowrap}.row{display:flex;gap:9px;align-items:center}.input{flex:1;border:1px solid #e5d9f4;border-radius:21px;background:#fff;min-height:46px;padding:12px 15px;color:#382a4b}.input:focus{outline:2px solid #d9b6ef;border-color:transparent}.send,.mic{border:0;border-radius:50%;width:46px;height:46px;color:white;font-size:18px;background:linear-gradient(140deg,#a86bdb,#ef92bd)}.send{border-radius:20px;width:61px;font-size:13px;font-weight:700}.message{display:none;margin:4px 0 10px;border-radius:13px;padding:10px 12px;background:#f3ebfa;color:#725b87;font-size:13px}.message.show{display:block}.manual-preview{display:none;margin:4px 0 10px;padding:12px;border:1px dashed #caafe4;border-radius:14px;color:#704d87;background:#fcf8ff;font-size:13px}.manual-preview.show{display:block}.caption{max-width:430px;margin:14px auto;text-align:center;color:#77658c;font-size:12px}
</style>
</head>
<body><main class="phone"><div class="top">今天的账本</div><div class="sub">8 月 6 日 · 每一笔都值得被看见</div><section class="card"><b>本月概览</b><div class="summary"><div><span>支出</span>¥ 1,286.50</div><div><span>收入</span>¥ 5,200.00</div><div><span>结余</span>¥ 3,913.50</div></div></section><p class="caption">原型：紫粉视觉 + 多方式录入，不使用参考图中的聊天角色界面</p></main><section class="dock"><div class="modes"><button class="mode active" data-mode="ai">✨ AI 记账</button><button class="mode" data-mode="manual">✏️ 手动记账</button><button class="mode" data-mode="import">⇩ 账单导入</button></div><div id="aiHint" class="hint">一句话告诉我这笔账，我来帮你填好</div><div id="examples" class="examples"><button class="example">午饭 32</button><button class="example">收红包 200</button><button class="example">昨天打车 50</button></div><div id="manual" class="manual-preview">进入手动面板：先输入金额，再选择收支和分类。</div><div id="message" class="message"></div><div class="row"><input id="text" class="input" placeholder="例如：昨天午饭 32 元" maxlength="200"><button id="send" class="send">识别</button><button id="mic" class="mic" aria-label="语音输入">◉</button></div></section><script>
const modes=document.querySelectorAll('.mode'),hint=document.querySelector('#aiHint'),examples=document.querySelector('#examples'),manual=document.querySelector('#manual'),message=document.querySelector('#message'),text=document.querySelector('#text'),send=document.querySelector('#send');
function note(v){message.textContent=v;message.classList.add('show')}function setMode(m){modes.forEach(x=>x.classList.toggle('active',x.dataset.mode===m));hint.style.display=m==='ai'?'block':'none';examples.style.display=m==='ai'?'flex':'none';manual.classList.toggle('show',m==='manual');message.classList.remove('show');if(m==='manual')note('将打开现有金额与分类面板。');if(m==='import')note('将进入账单页并拉起当前支持的 CSV/TXT 导入。')}modes.forEach(x=>x.onclick=()=>setMode(x.dataset.mode));document.querySelectorAll('.example').forEach(x=>x.onclick=()=>{text.value=x.textContent;text.focus()});send.onclick=()=>note(text.value?'AI 正在识别，成功后进入可编辑的确认面板。':'先输入一笔账再识别');document.querySelector('#mic').onclick=()=>{note('开始语音输入；转写后回填输入框，不自动提交。');text.focus()};
</script></body></html>
